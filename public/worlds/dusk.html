<style>
:root {
  --cream: #f6ead8;
  --cream-2: rgba(246, 234, 216, .74);
  --cream-3: rgba(246, 234, 216, .4);
  --ink: #140e10;
  --ember: #e27a48;
  --rose: #c98a7c;
  --teal: #1d3a3c;

  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --ease-io: cubic-bezier(.7, 0, .2, 1);
  --gut: clamp(16px, 4vw, 56px);
  --tint: 66 48 60;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-width: thin; scrollbar-color: rgba(246,234,216,.35) transparent; -webkit-text-size-adjust: 100%; }
html.locked { overflow: hidden; }
body {
  margin: 0; background: #2a2630; color: var(--cream);
  font-family: var(--serif); font-size: clamp(1.12rem, 1.05rem + .45vw, 1.42rem); line-height: 1.32;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--ember); color: var(--ink); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: rgba(246,234,216,.3); border-radius: 8px; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .22em; text-decoration-color: var(--cream-3); transition: text-decoration-color .3s var(--ease), color .3s var(--ease); }
a:hover { text-decoration-color: var(--cream); }
:focus-visible { outline: 2px solid #ffcf9a; outline-offset: 3px; border-radius: 4px; }
button { font: inherit; color: inherit; }

/* ---------- world ---------- */
.sky-fallback {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(60% 40% at 28% 58%, rgba(255, 214, 150, .75), rgba(255, 170, 100, 0) 70%),
    linear-gradient(to bottom, #56708a 0%, #8f7f8a 26%, #c98a7c 44%, #f4b26a 57.5%, #3a3c38 58%, #1d3a3c 70%, #0f2422 100%);
}
#gl { position: fixed; inset: 0; width: 100vw; height: 100lvh; z-index: 1; display: block; opacity: 0; transition: opacity 1.2s var(--ease); }

.veil {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(16, 10, 14, .62) 0%, rgba(16, 10, 14, .4) 30%, rgba(16, 10, 14, .1) 50%, rgba(16, 10, 14, 0) 62%),
    linear-gradient(to top, rgba(10, 8, 12, .45), rgba(10, 8, 12, 0) 32%);
}

/* ---------- chrome ---------- */
.mono { font-family: var(--mono); font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; line-height: 1.5; font-weight: 400; }
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 1.5rem;

}
.bar > * { pointer-events: auto; }
.back { color: var(--cream-2); text-decoration: none; }

.jump { display: flex; gap: 1.4rem; margin-left: auto; }
.jump a { text-decoration: none; color: var(--cream-2); position: relative; }

.pill {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .09em; text-transform: uppercase;

  transition: background .4s var(--ease), color .4s var(--ease), border-color .4s var(--ease), transform .4s var(--ease);
}
.pill:hover { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.pill:active { transform: scale(.97); }
.pill.solid { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.pill.solid:hover { background: #ffd9a8; border-color: #ffd9a8; }
.talk { margin-left: 0; }
.jump + .talk { margin-left: .4rem; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 0 rgba(226,122,72,.6); animation: breathe 2.8s var(--ease) infinite; }
@keyframes breathe { 0% { box-shadow: 0 0 0 0 rgba(226,122,72,.55); } 70%, 100% { box-shadow: 0 0 0 7px rgba(226,122,72,0); } }
.sound {
  position: fixed; z-index: 20; left: var(--gut); bottom: calc(16px + env(safe-area-inset-bottom));
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity .8s var(--ease) 1.4s, transform .8s var(--ease) 1.4s, background .4s var(--ease), color .4s var(--ease);
}
html.entered .sound { opacity: 1; transform: none; pointer-events: auto; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
.bars i { width: 2px; height: 3px; background: currentColor; border-radius: 1px; transition: height .3s var(--ease); }
.sound[aria-pressed="true"] .bars i { animation: eq 1.1s ease-in-out infinite; }
.sound[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -.4s; }
.sound[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -.75s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }

/* contact panel */
#contact {
  position: fixed; inset: auto; top: calc(62px + env(safe-area-inset-top)); right: var(--gut); margin: 0;
  width: min(23rem, calc(100vw - 32px)); padding: 1.4rem 1.4rem 1.2rem;
  background: #1b1416; color: var(--cream); border: 1px solid rgba(246,234,216,.18); border-radius: 18px;
  box-shadow: 0 24px 60px -12px rgba(0,0,0,.55);

}
#contact:popover-open { opacity: 1; transform: none; }

#contact h2 { font-family: var(--display); font-weight: 500; font-variation-settings: "opsz" 100; text-transform: uppercase; font-size: 2.3rem; line-height: .9; margin: 0 0 .9rem; letter-spacing: -.005em; }
#contact h2 em, .big em { font-family: var(--serif); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: 0; }
#contact p { margin: 0 0 1.1rem; color: var(--cream-2); font-size: 1.1rem; }
.close { position: absolute; top: .8rem; right: .8rem; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(246,234,216,.2); background: none; cursor: pointer; display: grid; place-items: center; transition: background .3s var(--ease); }
.close:hover { background: rgba(246,234,216,.1); }
.close svg { width: 12px; height: 12px; }
.mail { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .7rem 0 .9rem; border-bottom: 1px solid rgba(246,234,216,.14); margin-bottom: .9rem; }
.mail span { font-family: var(--serif); font-size: 1.32rem; user-select: all; -webkit-user-select: all; word-break: break-all; }
.copy { font-family: var(--mono); font-size: .64rem; letter-spacing: .09em; text-transform: uppercase; background: none; border: 1px solid rgba(246,234,216,.35); border-radius: 999px; padding: .55em .95em; cursor: pointer; display: inline-flex; gap: .45em; align-items: center; white-space: nowrap; transition: background .3s var(--ease), color .3s var(--ease); }
.copy:hover { background: var(--cream); color: var(--ink); }
.copy svg { width: 11px; height: 11px; }
.copy.done { background: var(--ember); border-color: var(--ember); color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: .5rem; }
.soon { color: var(--cream-3); text-transform: none; letter-spacing: .02em; }

/* ---------- loader ---------- */
#loader {
  position: fixed; inset: 0; z-index: 50; background: #171113;
  display: grid; place-items: center; text-align: center;
  clip-path: inset(0 0 0 0); transition: clip-path 1.25s var(--ease-io);
}
#loader.up { clip-path: inset(0 0 100% 0); }
#loader.gone { display: none; }
.ld-inner { display: grid; gap: 2.2rem; justify-items: center; }
.ld-count { font-family: var(--display); font-variation-settings: "opsz" 100; font-weight: 300; font-size: clamp(3rem, 7vw, 5rem); line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--cream); }
.ld-count sup { font-family: var(--mono); font-size: .7rem; vertical-align: top; margin-left: .3em; color: var(--cream-3); }
.ld-enter { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; opacity: 0; transform: translateY(8px); transition: opacity .9s var(--ease), transform .9s var(--ease); pointer-events: none; }
.ld-enter.show { opacity: 1; transform: none; pointer-events: auto; }
.ld-name { position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom)); color: var(--cream-3); }
.ld-line { width: min(220px, 50vw); height: 1px; background: rgba(246,234,216,.14); position: relative; overflow: hidden; }
.ld-line i { position: absolute; inset: 0; background: var(--cream-2); transform-origin: left; transform: scaleX(0); }

/* ---------- story ---------- */
main { position: relative; z-index: 5; }
.sec { min-height: 100svh; display: flex; align-items: center; padding: 18vh var(--gut); }
.copy-col { width: min(52rem, 100%); }
#hero { align-items: flex-end; padding-bottom: 15vh; position: relative; }
.hero-win { position: absolute; right: 4vw; top: 15vh; width: 40vw; height: 58vh; pointer-events: none; }
.big {
  font-family: var(--display); font-weight: 480; font-variation-settings: "opsz" 100;
  text-transform: uppercase; font-size: clamp(3.3rem, 1.6rem + 7.4vw, 8.6rem); line-height: .84; letter-spacing: -.012em;
  margin: 0 0 .32em; text-wrap: balance; text-shadow: 0 2px 40px rgba(20, 10, 14, .25);
}
.big em { font-size: .93em; padding-right: .04em; }
.line { margin: 0; max-width: 30ch; font-size: clamp(1.3rem, 1.1rem + .9vw, 1.9rem); line-height: 1.18; color: var(--cream); }
.cue { display: flex; align-items: center; gap: .8rem; margin-top: 2.6rem; color: var(--cream-2); }
.cue i { width: 44px; height: 1px; background: rgba(246,234,216,.25); position: relative; overflow: hidden; }
.cue i::after { content: ""; position: absolute; inset: 0; background: var(--cream); animation: cue 2.4s var(--ease-io) infinite; }
@keyframes cue { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }

/* sections: title + shape frame on top, an even carousel of cards below */
.veil { transition: opacity 1s var(--ease); }
html.past-hero .veil { opacity: .25; }
.csec { padding: calc(74px + env(safe-area-inset-top)) var(--gut) 28px; }
.lay { width: 100%; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 20px 10px; align-items: end; }
.head { display: flex; flex-direction: column; gap: .9rem; padding-bottom: 4px; }
.head .big { font-size: clamp(2.6rem, .8rem + 4.4vw, 6.2rem); margin: 0; text-shadow: none; }
.head .tx { max-width: 34ch; }
.head > .tag { color: var(--cream); }
.car, .ctl, .row3, .duo { grid-column: 1 / -1; min-width: 0; }
/* stacked carousel: the current card sits in front, its neighbours tuck in behind on each side */
.car { --cw: 52%; --off: 38%; margin: 0 calc(-1 * var(--gut)); overflow-x: clip; }
.stk { display: grid; padding: 8px 0 14px; outline-offset: 4px; touch-action: pan-y; cursor: grab; user-select: none; }
.stk .card {
  grid-area: 1 / 1; justify-self: center; width: var(--cw);
  background: linear-gradient(rgb(var(--tint) / .72), rgb(var(--tint) / .72)), #140e14;
  -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: 0 24px 60px rgba(8,5,9,.45);
  transform: translateX(calc(var(--d, 0) * var(--off))) scale(calc(1 - var(--a, 0) * .14));
  z-index: calc(10 - var(--a, 0)); opacity: var(--o, 1);
  transition: transform .8s var(--ease), opacity .8s var(--ease), border-color .5s var(--ease);
}
.stk .card::after { content: ""; position: absolute; inset: -1px; background: #140e14; opacity: calc(var(--a, 0) * .72); pointer-events: none; transition: opacity .8s var(--ease); }
.stk .card.cur { border-color: rgba(246,234,216,.5); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card {
  --pad: clamp(18px, 1.5vw, 26px); min-width: 0;
  position: relative; display: flex; flex-direction: column; gap: .6rem;
  padding: var(--pad); border-radius: 2px; color: var(--cream); text-decoration: none;
  background: rgb(var(--tint) / .72); border: 1px solid rgba(246,234,216,.16);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transition: border-color .5s var(--ease), background .5s var(--ease);
}
.card > * { margin: 0; transition: opacity .5s var(--ease); }
.card > p.tag:first-of-type { display: flex; justify-content: space-between; gap: 1em; padding-bottom: .7rem; border-bottom: 1px solid rgba(246,234,216,.14); }
a.card:hover { border-color: rgba(246,234,216,.5); }
.tag { color: var(--cream-2); margin: 0; }
.hd { margin: 0; font-family: var(--display); font-variation-settings: "opsz" 60; font-weight: 520; text-transform: uppercase; font-size: clamp(1.3rem, .9rem + .9vw, 2rem); line-height: .95; letter-spacing: .005em; }
.hd em { font-family: var(--serif); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: 0; }
.tx { margin: 0; font-size: clamp(1.02rem, .92rem + .3vw, 1.24rem); line-height: 1.3; color: var(--cream-2); }
.stack { margin-top: auto !important; }
.stack span + span::before { content: "/"; margin: 0 .7em; color: var(--cream-3); }
.three em { color: var(--cream); font-family: var(--serif); font-size: 1.45rem; text-transform: none; letter-spacing: 0; display: block; line-height: 1.15; }
/* project screenshots */
.built .car { --cw: 66%; --off: 27%; }
/* wide project cards: screenshot on the left, words on the right */
.built .stk .card { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: auto auto auto 1fr; gap: .6rem 0; }
.built .stk .card > * { grid-column: 2; padding-left: var(--pad); }
.built .stk .card > .media { grid-column: 1; grid-row: 1 / 5; padding: 0; margin: calc(-1 * var(--pad)) 0 calc(-1 * var(--pad)) calc(-1 * var(--pad)); border-bottom: 0; border-right: 1px solid rgba(246,234,216,.14); }
.built .stk .card > .stack { align-self: end; }
.media { margin: calc(-1 * var(--pad)) calc(-1 * var(--pad)) .5rem; aspect-ratio: 16 / 9; overflow: hidden; background: #120d12; border-bottom: 1px solid rgba(246,234,216,.14); display: flex; justify-content: center; align-items: center; gap: 5%; }
.media img[src*="lecture"] { object-position: center; }
.media img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.media.phones img { width: auto; height: 90%; object-fit: contain; border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.media.none { background: radial-gradient(120% 90% at 30% 20%, rgb(var(--tint) / .9), #120d12); flex-direction: column; gap: .4rem; }
.media.none .big { font-size: clamp(2rem, 1rem + 2.4vw, 3.6rem); margin: 0; text-shadow: none; }
.card.ph { background: rgb(var(--tint) / .3); border: 1px dashed rgba(246,234,216,.35); color: var(--cream-3); justify-content: center; align-items: center; text-align: center; }
.win {
  height: 32svh; pointer-events: none;
  --tk: linear-gradient(rgba(246,234,216,.85), rgba(246,234,216,.85));
  background: var(--tk) left top / 18px 1px, var(--tk) left top / 1px 18px, var(--tk) right top / 18px 1px, var(--tk) right top / 1px 18px,
    var(--tk) left bottom / 18px 1px, var(--tk) left bottom / 1px 18px, var(--tk) right bottom / 18px 1px, var(--tk) right bottom / 1px 18px;
  background-repeat: no-repeat;
}
/* carousel controls: a progress line and two arrows */
.ctl { display: flex; align-items: center; gap: 14px; }
.ctl[hidden] { display: none; }
.bar-l { flex: 1; height: 1px; background: rgba(246,234,216,.2); position: relative; overflow: hidden; }
.bar-l i { position: absolute; inset: 0 auto 0 0; background: var(--cream); width: var(--w, 30%); transform: translateX(var(--x, 0%)); transition: transform .45s var(--ease), width .45s var(--ease); }
.count { color: var(--cream-2); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
.arw { width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(246,234,216,.55); background: rgba(20,14,16,.28); color: var(--cream); display: grid; place-items: center; cursor: pointer; transition: background .3s var(--ease), color .3s var(--ease), opacity .3s; }

.arw svg { width: 14px; height: 14px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.row3 .card .hd { font-size: clamp(1.1rem, .8rem + .7vw, 1.6rem); }
.say { display: flex; flex-direction: column; gap: .5rem; }
.say .mail { border-color: rgba(246,234,216,.25); margin: 0; justify-content: flex-start; gap: 1.2rem; max-width: max-content; }
.say .mail span { font-size: clamp(1.3rem, 1rem + 1.4vw, 2.3rem); }
.foot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 1em; color: var(--cream-3); }

.built .win { height: 20svh; }

/* reveal: translate + clip, short stagger */
.tl { opacity: 0; transform: translateY(22px); clip-path: inset(0 0 14% 0); transition: opacity .8s var(--ease), transform 1s var(--ease), clip-path 1s var(--ease), border-color .5s var(--ease); transition-delay: calc(var(--i, 0) * 65ms); }
.in .tl { opacity: 1; transform: none; clip-path: inset(0); }

.rv { opacity: .001; filter: blur(12px); transform: translateY(18px); transition: opacity 1.2s var(--ease), filter 1.2s var(--ease), transform 1.4s var(--ease); transition-delay: calc(var(--i, 0) * 90ms); }

  .sound { top: calc(14px + env(safe-area-inset-top)); bottom: auto; left: auto; right: calc(var(--gut) + 8.2rem); padding: .82em; }
  #soundlbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .veil { background: linear-gradient(to top, rgba(10, 8, 12, .7), rgba(10, 8, 12, .15) 55%, rgba(10, 8, 12, 0) 70%); }
  #hero { padding: 40svh var(--gut) 14svh; }

}
@media (max-width: 819px) {

  const kindOf = n => (D.projects.find(q => q.name === n) || {}).kind || "";
  const projCard = (n, k) => C(k + 1, media(n) + top(pad(k), kindOf(n)) + p("hd", splitName(n)) + p("tx", esc(proj(n).one)) + tiny(n));

  document.getElementById("story").innerHTML =
    sec("hero",

      '<p class="line rv" style="--i:2">' + esc(V.line) + '</p>' +
      '<div class="cue mono rv" style="--i:4" aria-hidden="true"><i></i>scroll</div>').replace('id="hero">', 'id="hero" data-a data-w="w-hero"><div class="hero-win" id="w-hero" aria-hidden="true"></div>') +
    csec("now", "right now", head("01", 'right <em>now</em>'), car(
      C(1, top("01", "studying") + p("hd", "UT <em>Austin</em>") + p("tx", esc(V.now[0]))) +
      C(2, top("02", "building") + p("hd", "<em>Probe</em>") + p("tx", esc(V.now[1]))), "right now")) +
    csec("past", "before this", head("02", '<em>before</em> this'), car(
      V.past.map((r, k) => C(k + 1, top(pad(k), r.when) + p("hd", esc(X[k].org)) + tag(X[k].role) + p("tx", esc(r.what)))).join(""), "roles")) +
    csec("won", "things i won", head("03", 'things i <em>won</em>'), car(
      V.wins.map((w, k) => C(k + 1, top(pad(k)) + p("hd", esc(w.short)) + p("tx", esc(w.what)))).join(""), "wins")) +
    csec("built", "things i built", head("04", 'things i <em>built</em>'), car(hl.concat(rest.map(r => r.name)).map(projCard).join(""), "projects")).replace('class="sec csec"', 'class="sec csec built"') +
    csec("off", "off hours", head("05", '<em>off</em> hours'), car(
      C(1, top("01", "camera") + p("tx lg", esc(V.offHours[0]))) +
      C(2, top("02", "how it started") + p("tx lg", esc(V.origin))) +
      C(3, top("03", "sports") + p("tx lg", esc(V.offHours[1]))) +
      C(4, top("04", "in three words") + '<p class="three">' + V.threeWords.map(w => '<em>' + esc(w) + '</em>').join("") + '</p>') +
      C(5, '<span class="mono">photos from the fz55 coming</span>', "ph"), "off hours")) +
    csec("contact-sec", "say hi", head("06", '<em>say</em> hi', '<div class="say">' + p("tx", esc(V.contactLine)) + mailRow + '</div>'),
      '<div class="row3">' +
        C(1, top("github") + p("hd", esc(L.github.replace(/^https:\/\/github\.com\//, ""))), "", "a", ' href="' + esc(L.github) + '" target="_blank" rel="noopener"') +
        C(2, top("linkedin") + p("hd", esc(L.linkedin.replace(/^.*\/in\/|\/$/g, ""))), "", "a", ' href="' + esc(L.linkedin) + '" target="_blank" rel="noopener"') +
        C(3, top("resume") + p("hd", 'pdf <em>coming</em>'), "", "a", ' href="' + esc(L.resume) + '"') +
      '</div><div class="foot">' + tag(V.name) + '<a class="mono tag" href="index.html">← all boards</a></div>');

  // carousels: one card in front, neighbours behind, loop, and advance on their own while in view
  const cars = [...document.querySelectorAll(".stk")].map(t => {
    const cards = [...t.children], n = cards.length, c = t.parentElement.nextElementSibling;
    const bar = c.querySelector(".bar-l i"), count = c.querySelector(".count"), [prev, next] = c.querySelectorAll(".arw");
    bar.style.setProperty("--w", 100 / n + "%");
    let cur = 0, hold = 0, over = false, seen = false, x0 = null;
    const go = i => {
      cur = (i % n + n) % n;
      cards.forEach((el, j) => {
        const d = (j - cur + n + Math.floor(n / 2)) % n - Math.floor(n / 2), a = Math.min(Math.abs(d), 2); // signed distance, wrapping
        el.style.setProperty("--d", d); el.style.setProperty("--a", a); el.style.setProperty("--o", a > 1 ? 0 : 1);
        el.classList.toggle("cur", d === 0); el.inert = d !== 0; el.setAttribute("aria-hidden", d !== 0);
      });
      count.textContent = pad(cur) + " / " + pad(n - 1); bar.style.setProperty("--x", cur * 100 + "%");
    };
    const touch = () => { hold = performance.now(); };
    const step = k => { touch(); go(cur + k); };
    prev.onclick = () => step(-1);
    next.onclick = () => step(1);
    // side cards are inert, so their clicks land on the stack: left half goes back, right half forward
    t.addEventListener("click", e => { if (!e.target.closest(".cur")) step(e.clientX < t.getBoundingClientRect().left + t.clientWidth / 2 ? -1 : 1); });
    t.addEventListener("keydown", e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); step(e.key === "ArrowLeft" ? -1 : 1); } });
    t.addEventListener("pointerdown", e => { x0 = e.clientX; });
    t.addEventListener("pointerup", e => { if (x0 !== null && Math.abs(e.clientX - x0) > 40) step(e.clientX < x0 ? 1 : -1); x0 = null; });
    t.addEventListener("pointerenter", () => { over = true; }); t.addEventListener("pointerleave", () => { over = false; x0 = null; });
    t.addEventListener("focusin", () => { over = true; }); t.addEventListener("focusout", () => { over = false; });
    new IntersectionObserver(es => { seen = es[0].isIntersecting; }, { threshold: .5 }).observe(t);
    go(0);
    return { tick: () => { if (seen && !over && !reduce && !document.hidden && performance.now() - hold > 7000) go(cur + 1); } };
  });
  setInterval(() => cars.forEach(c => c.tick()), 4200);
  const onPage = () => root.classList.toggle("past-hero", scrollY > innerHeight * .5);
  addEventListener("scroll", onPage, { passive: true });
  onPage();

  document.getElementById("contact").innerHTML =
    '<button class="close" type="button" popovertarget="contact" popovertargetaction="hide" aria-label="close"><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11"/></svg></button>' +
    '<h2 id="ct-h"><em>let\'s</em> talk</h2><p>' + esc(V.contactLine) + '</p>' + mailRow + linkPills;
  document.getElementById("ldname").textContent = V.name;

  // copy buttons
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-copy]");
    if (!b) return;
    const done = () => { b.classList.add("done"); b.querySelector("b").textContent = "copied"; setTimeout(() => { b.classList.remove("done"); b.querySelector("b").textContent = "copy"; }, 1800); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.querySelector("b").textContent = "selected, ⌘C"; };
    if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, sel); else sel();
  });

  // reveals
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: .18 });
  const watch = () => document.querySelectorAll(".csec").forEach(s => io.observe(s));
  const jl = [...document.querySelectorAll(".jump a")];
  const io2 = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    jl.forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + e.target.id ? "true" : "false"));
  }), { rootMargin: "-45% 0px -45% 0px" });
  document.querySelectorAll(".sec").forEach(s => io2.observe(s));

  // ---- sound: wind + crickets, synthesized ----
  let ac = null, master = null, crBus = null, soundOn = false, sched = 0;
  const sBtn = document.getElementById("sound"), sLbl = document.getElementById("soundlbl");
  function buildAudio() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const len = ac.sampleRate * 4, buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); let last = 0; for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; } }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 420; bp.Q.value = .6;
    const wg = ac.createGain(); wg.gain.value = .55;
    const l1 = ac.createOscillator(), l1g = ac.createGain(); l1.frequency.value = .06; l1g.gain.value = 260; l1.connect(l1g).connect(bp.frequency);
    const l2 = ac.createOscillator(), l2g = ac.createGain(); l2.frequency.value = .11; l2g.gain.value = .3; l2.connect(l2g).connect(wg.gain);
    src.connect(bp).connect(wg).connect(master); src.start(); l1.start(); l2.start();
    crBus = ac.createGain(); crBus.gain.value = 0; crBus.connect(master);
    const crickets = [4300, 4650, 5050].map((f, i) => {
      const o = ac.createOscillator(); o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = 0;
      const p = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain();
      if (p.pan) p.pan.value = [-.6, .5, .1][i];
      o.connect(g).connect(p).connect(crBus); o.start();
      return { g, next: ac.currentTime + .3 + i * .37 };
    });
    sched = setInterval(() => {
      const now = ac.currentTime, dusk = (window.DUSK && window.DUSK.dusk) || 0;
      crBus.gain.setTargetAtTime(.012 + .05 * Math.min(1, dusk * 1.4), now, .8);
      crickets.forEach(c => {
        while (c.next < now + .5) {
          for (let k = 0; k < 3; k++) { const t = c.next + k * .045; c.g.gain.setValueAtTime(0, t); c.g.gain.linearRampToValueAtTime(.7, t + .006); c.g.gain.linearRampToValueAtTime(0, t + .03); }
          c.next += .55 + Math.random() * .7;
        }
      });
    }, 200);
  }
  function setSound(on) {
    soundOn = on;
    if (on && !ac) buildAudio();
    if (ac) { if (on) ac.resume(); master.gain.setTargetAtTime(on ? .5 : 0, ac.currentTime, .6); }
    sBtn.setAttribute("aria-pressed", String(on));
    sLbl.textContent = on ? "sound on" : "sound off";
  }
  sBtn.addEventListener("click", () => setSound(!soundOn));
  document.addEventListener("visibilitychange", () => { if (!ac) return; document.hidden ? ac.suspend() : soundOn && ac.resume(); });

  // ---- loader ----
  const loader = document.getElementById("loader"), pct = document.getElementById("pct"), pline = document.getElementById("pctline"), enter = document.getElementById("enter");
  let target = .08, shown = 0, ready = false;
  const DUSK = window.DUSK = { entered: false, enteredAt: 0, dusk: 0, hi: -1, reduce,
    load(v) { target = Math.max(target, v); },
    fail() { root.classList.add("no-gl"); target = 1; },
    on: () => {} };
  function doEnter(withSound) {
    DUSK.entered = true; DUSK.enteredAt = performance.now();
    root.classList.remove("locked"); root.classList.add("entered");
    if (withSound) setSound(true);
    loader.classList.add("up");
    setTimeout(() => { loader.classList.add("gone"); }, 1300);
    setTimeout(() => document.getElementById("hero").classList.add("in"), reduce ? 0 : 450);
    watch(); DUSK.on();
    const h1 = document.querySelector("#hero h1"); h1.tabIndex = -1; h1.focus({ preventScroll: true });
  }
  enter.addEventListener("click", e => { const b = e.target.closest("button"); if (b) doEnter(b.dataset.sound === "1"); });
  if (skip) {
    loader.classList.add("gone"); DUSK.entered = true; DUSK.enteredAt = -1e5;
    root.classList.add("entered"); document.getElementById("hero").classList.add("in"); watch();
  } else {
    root.classList.add("locked"); scrollTo(0, 0);
    setTimeout(() => DUSK.load(1), 9000); // never trap anyone behind a slow GPU or CDN
    const tick = () => {
      shown += (target - shown) * (reduce ? 1 : .07) + (shown < target ? .002 : 0);
      if (shown > target) shown = target;
      const n = Math.round(shown * 100);
      pct.firstChild.nodeValue = String(n);
      pline.style.transform = "scaleX(" + shown + ")";
      if (n >= 100 && !ready) { ready = true; enter.classList.add("show"); enter.querySelector("button").focus({ preventScroll: true }); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  if (document.fonts) document.fonts.ready.then(() => DUSK.load(.3));
})();
</script>

<script type="module">
const DUSK = window.DUSK;
const reduce = DUSK.reduce;
const mobile = Math.min(innerWidth, innerHeight) < 600 || matchMedia("(pointer: coarse)").matches;

async function main() {
  let THREE, Reflector;
  try {
    THREE = await import("three");
    ({ Reflector } = await import("three/addons/objects/Reflector.js"));
  } catch (e) { console.warn("three failed to load", e); return DUSK.fail(); }
  DUSK.load(.5);

  const canvas = document.getElementById("gl");
  let renderer;
  try {
    THREE.ColorManagement.enabled = false; // all colors authored and output in sRGB
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  } catch (e) { console.warn("no webgl", e); return DUSK.fail(); }
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  const DPR = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 1.75);
  renderer.setPixelRatio(DPR);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 900);

  // ---------- palette: golden hour -> dusk -> night ----------
  const K = (...h) => h.map(x => new THREE.Color(x));
  const PAL = {
    zen: K("#5b7590", "#33406a", "#070c1a"), mid: K("#cf9284", "#a5627a", "#15203a"),
    hor: K("#f6b66c", "#e8804e", "#2b3550"), sun: K("#ffc58a", "#ff8a4c", "#3a2a40"),
    cLit: K("#ffcfa0", "#ec9680", "#26304a"), cDark: K("#93707e", "#56405e", "#0d1426"),
    gLit: K("#b88a52", "#7a5048", "#1a242c"), gShade: K("#1f3c3e", "#192a3c", "#070d16"),
    tip: K("#ecb76a", "#cc7864", "#2c3e4e"), base: K("#11302e", "#0f2230", "#050b12"),
    water: K("#1d3c44", "#18283e", "#070d18"), pA: K("#fff3e2", "#ffe6d2", "#fff0dc"), pB: K("#ffc08f", "#ffa58c", "#ffcf9a")
  };
  const tmp = new THREE.Color();
  const pal = (k, d, out) => { const c = PAL[k]; return d < .5 ? out.lerpColors(c[0], c[1], d * 2) : out.lerpColors(c[1], c[2], (d - .5) * 2); };
  const col = () => ({ value: new THREE.Color() });
  const U = {
    uTime: { value: 0 }, uFog: col(), uSunDir: { value: new THREE.Vector3(-.06, .06, -1).normalize() }, uSun: col(),
    uZen: col(), uMid: col(), uHor: col(), uCLit: col(), uCDark: col(), uNight: { value: 0 },
    uGLit: col(), uGShade: col(), uTip: col(), uBase: col(), uMouse: { value: new THREE.Vector2(999, 999) }, uWind: { value: 1 }
  };

  const NOISE = `
    float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
    float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 5; i++){ v += a*vnoise(p); p = p*2.03 + 17.1; a *= .5; } return v; }
    float pondD(vec2 xz){ return length((xz - vec2(0., -9.))/vec2(16., 10.5)); }`;
  const FOG = `uniform vec3 uFog;
    vec3 fogIt(vec3 c, vec3 w){ float d = length(w - cameraPosition); return mix(c, uFog, smoothstep(14., 130., d)*.94); }`;

  // ---------- sky ----------
  const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: U,
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,

        vec3 p = mix(position, aTo, m);
        float k = sin(3.14159*m);
        vec3 q = p*.7 + aR*10.;
        p += k*vec3(sin(q.y*1.3 + uTime*.7), sin(q.z*1.1 + uTime*.6 + 1.), sin(q.x*1.2 + uTime*.8 + 2.))*(.6 + aR*.9);
        p += .03*vec3(sin(uTime*.9 + aR*40.), cos(uTime*.8 + aR*30.), sin(uTime*.7 + aR*20.));
        float ie = smoothstep(aR*.35, aR*.35 + .65, uIntro);
        vec3 sc = vec3(sin(aR*91.7), sin(aR*53.3 + 1.), cos(aR*37.1))*vec3(9., 4., 6.) + vec3(0., 1.5, 0.);
        p = mix(sc, p, ie);
        vec3 dm = p - uM; float dl = length(dm.xy), push = smoothstep(1., 0., dl);
        p += normalize(dm + vec3(0., 0., .001))*push*.6;
        vec4 mv = modelViewMatrix*vec4(p, 1.);
        float tw = .75 + .25*sin(uTime*2.3 + aR*90.);
        gl_PointSize = uSize*(.55 + aR*.95)*tw*uPR*(10./-mv.z);
        vA = uOp*(.8 + .35*tw)*(1. - k*.3)*(.35 + .65*ie); vR = aR;
        if (uRing > .01 && uHi > -.5){
          vec3 rp = mix(position, aTo, uRingTo);
          float cl = mod(floor((atan(rp.y/.55, rp.x/2.) - .3)/6.28318*7. + .5), 7.);
          float on = 1. - step(.5, abs(cl - uHi));
          vA *= mix(1., mix(.45, 2.1, on), uRing); gl_PointSize *= mix(1., mix(.85, 1.35, on), uRing);
        }
        gl_Position = projectionMatrix*mv;
      }`,
    fragmentShader: `uniform vec3 uCA, uCB; varying float vA; varying float vR;
      void main(){ float a = pow(smoothstep(.5, 0., length(gl_PointCoord - .5)), 1.5); gl_FragColor = vec4(mix(uCA, uCB, vR*vR), a*vA); }`
  }));
  points.frustumCulled = false;
  scene.add(points);

  // ---------- layout, scroll, pointer ----------
  let wide = true, anchors = [], pTarget = 0, pS = 0, cur = -1, shown = 0, fade = 1, dirty = true;
  const mqM = matchMedia("(max-width: 819px)");
  const A = [...document.querySelectorAll("[data-a]")].map(el => ({ el, w: document.getElementById(el.dataset.w), mw: document.getElementById(el.dataset.mw || el.dataset.w) }));
  const winOf = k => mqM.matches ? A[k].mw : A[k].w;
  function layout() {
    const w = innerWidth, h = innerHeight;
    wide = w / h > 1.05;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = wide ? 38 : 58; camera.updateProjectionMatrix();
    pond.getRenderTarget().setSize(Math.round(w * DPR * rScale), Math.round(h * DPR * rScale));
    anchors = A.map((a, k) => { const r = (k && mqM.matches ? a.mw : a.el).getBoundingClientRect(); return r.top + scrollY + r.height / 2; });
    onScroll(); dirty = true;
  }
  function onScroll() {
    const c = scrollY + innerHeight / 2;
    let p = 0;
    if (c >= anchors[anchors.length - 1]) p = anchors.length - 1;
    else for (let i = 0; i < anchors.length - 1; i++) if (c < anchors[i + 1]) { p = i + Math.max(0, (c - anchors[i]) / (anchors[i + 1] - anchors[i])); break; }
    pTarget = Math.min(p, S - 1); dirty = true;
  }
  addEventListener("resize", layout);
  mqM.addEventListener("change", layout);
  addEventListener("scroll", onScroll, { passive: true });
  document.fonts && document.fonts.ready.then(layout);

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), mouse = new THREE.Vector2(0, 0), mS = new THREE.Vector2(0, 0);
  const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), front = new THREE.Plane(new THREE.Vector3(0, 0, 1), 7), hit = new THREE.Vector3();
  const gM = new THREE.Vector2(999, 999), gMS = new THREE.Vector2(999, 999);
  let hasMouse = false;
  const tmpV = new THREE.Vector2();
  addEventListener("pointermove", e => { mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); hasMouse = true; }, { passive: true });
  document.addEventListener("pointerleave", () => { hasMouse = false; });

  // ---------- loop ----------
  let running = !document.hidden, last = performance.now(), time = 0;
  const camPos = new THREE.Vector3(), look = new THREE.Vector3(), zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 11);
  let lastTint = "";
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (reduce && !dirty && fade >= 1) return;
    dirty = false;
    if (!reduce) time += dt;
    U.uTime.value = time; pond.material.uniforms.uTime.value = time;

    // shape morph along the scroll
    if (reduce) {
      pS = pTarget;
      const want = Math.round(pS);
      if (want !== shown) { fade -= dt * 4; if (fade <= 0) { shown = want; pGeo.attributes.position.array.set(shapes[shown]); pGeo.attributes.position.needsUpdate = true; fade = 0; } }
      else if (fade < 1) fade = Math.min(1, fade + dt * 4);
      if (want !== shown || fade < 1) dirty = true;
      pU.uMix.value = 0; pU.uOp.value = fade;
    } else {
      pS += (pTarget - pS) * (1 - Math.exp(-dt * 3.2));
      const i = Math.min(Math.floor(pS), S - 2), f = pS - i;
      if (i !== cur) { cur = i; pGeo.attributes.position.array.set(shapes[i]); pGeo.attributes.aTo.array.set(shapes[i + 1]); pGeo.attributes.position.needsUpdate = pGeo.attributes.aTo.needsUpdate = true; }
      pU.uMix.value = sm(.12, .88, f);
      if (DUSK.entered) pU.uIntro.value = Math.min(1, Math.max(0, (now - DUSK.enteredAt - 500) / 2600));
    }

    // sky: golden hour -> night across the page
    const d = reduce ? .04 : sm(.06, .97, pS / (S - 1));
    DUSK.dusk = d;
    pal("zen", d, U.uZen.value); pal("mid", d, U.uMid.value); pal("hor", d, U.uHor.value); pal("sun", d, U.uSun.value);
    pal("cLit", d, U.uCLit.value); pal("cDark", d, U.uCDark.value); pal("gLit", d, U.uGLit.value); pal("gShade", d, U.uGShade.value);
    pal("tip", d, U.uTip.value); pal("base", d, U.uBase.value); pal("water", d, pond.material.uniforms.color.value);
    pal("pA", d, pU.uCA.value); pal("pB", d, pU.uCB.value);
    U.uFog.value.copy(U.uHor.value).lerp(U.uMid.value, .25);
    const el = .085 - d * .2;
    U.uSunDir.value.set(-.06, el, -1).normalize();
    U.uNight.value = sm(.55, .95, d);
    fU.uOn.value = reduce ? 0 : sm(.35, .7, d);
    U.uWind.value = 1 - d * .45;

    // camera drift + parallax
    const k = 1 - Math.exp(-dt * (reduce ? 60 : 2.5));
    mS.lerp(hasMouse && !reduce ? mouse : tmpV.set(0, 0), k);
    camPos.set(-.5 + pS * .1 + mS.x * .4, 2.4 + Math.sin(pS * .7) * .15 + mS.y * .14, 8);
    camera.position.copy(camPos);
    look.set(0, 2.0, -10); camera.lookAt(look);
    sky.position.copy(camera.position);
    camera.updateMatrixWorld();

    // the shape sits in the current section's window tile, sliding to the next one as the scroll moves on
    const wi = reduce ? shown : Math.min(Math.floor(pS), S - 2), wm = reduce ? 0 : pU.uMix.value;
    const ra = winOf(wi).getBoundingClientRect(), rb = winOf(Math.min(wi + 1, S - 1)).getBoundingClientRect();
    const L = (x, y) => x + (y - x) * wm;
    const wx = L(ra.left + ra.width / 2, rb.left + rb.width / 2), wy = L(ra.top + ra.height / 2, rb.top + rb.height / 2);
    ndc.set(wx / innerWidth * 2 - 1, -(wy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(zPlane, hit)) {
      points.position.copy(hit);
      const upx = 2 * hit.distanceTo(camera.position) * Math.tan(camera.fov * Math.PI / 360) / innerHeight;
      points.scale.setScalar(Math.min(2.4, Math.min(L(ra.width, rb.width) * upx / 5.6, L(ra.height, rb.height) * upx / 4.1)));
    }
    // panels take the sky's color, so they darken with the dusk
    pal("cDark", d, tmp).multiplyScalar(.55);
    const tint = Math.round(tmp.r * 255) + " " + Math.round(tmp.g * 255) + " " + Math.round(tmp.b * 255);
    if (tint !== lastTint) { lastTint = tint; document.documentElement.style.setProperty("--tint", tint); }
    // "seven more": the hovered project's cluster brightens
    pU.uHi.value = DUSK.hi;
    pU.uRing.value = 0;
    
    points.rotation.y = reduce ? -.25 : Math.sin(time * .22) * .32 + mS.x * .3;
    points.rotation.x = reduce ? 0 : -mS.y * .12;

    // cursor: parts the grass, ripples the pond, scatters the particles
    if (hasMouse && !reduce) {
      ndc.copy(mouse); ray.setFromCamera(ndc, camera);
      if (ray.ray.intersectPlane(ground, hit) && hit.distanceTo(camera.position) < 40) gM.set(hit.x, hit.z); else gM.set(999, 999);
      front.constant = -points.position.z;
      if (ray.ray.intersectPlane(front, hit)) { points.worldToLocal(hit); pU.uM.value.lerp(hit, .2); }
    } else { gM.set(999, 999); pU.uM.value.set(99, 99, 0); }
    if (gM.x > 900) gMS.copy(gM); else if (gMS.x > 900) gMS.copy(gM); else gMS.lerp(gM, .12);
    U.uMouse.value.copy(gMS); pond.material.uniforms.uMouse.value.copy(gMS);

    renderer.render(scene, camera);
  }
  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if (running) { last = performance.now(); dirty = true; requestAnimationFrame(frame); }
  });

  layout();
  try { renderer.compile(scene, camera); } catch (e) { console.warn(e); }
  renderer.render(scene, camera);
  document.documentElement.classList.add("gl-on");
  DUSK.load(1);
  if (running) requestAnimationFrame(frame);
}
main().catch(e => { console.warn(e); DUSK.fail(); });
</script>
</body>
</html>
