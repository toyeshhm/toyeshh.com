<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Jacquarda+Bastarda+9&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#120e1c; --lapis-0:#0c1540; --lapis-1:#16246a; --lapis-2:#2346a8; --lapis-3:#6f93e8;
  --verm:#d8432b; --verm-d:#8f2216; --gold:#e8bb47; --gold-d:#9c7020; --gold-l:#f8e3a2;
  --verd:#3f9e86; --verd-l:#8fd8bc; --vellum:#f3ecd9; --mist:#c3cdf2;
  --black:"Jacquard 24","Old English Text MT","UnifrakturMaguntia",serif;
  --bastard:"Jacquarda Bastarda 9","Jacquard 24",serif;
  --pix:"Pixelify Sans",ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--lapis-0);color:var(--vellum);font-family:var(--pix);font-size:17px;line-height:1.45;overflow:hidden;
  display:grid;grid-template-columns:380px 1fr;grid-template-rows:auto 1fr;height:100dvh;-webkit-font-smoothing:antialiased;font-variant-ligatures:none}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 0 6px var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--gold-d) var(--lapis-0)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--lapis-0)}::-webkit-scrollbar-thumb{background:var(--gold-d);border:2px solid var(--lapis-0)}
a{color:var(--gold-l);text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--gold-d)}
a:hover{text-decoration-color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}

/* the crest and chronicle: the left leaf of the codex */
#crest{grid-column:1;grid-row:1;padding:28px 28px 18px;background:var(--lapis-1);border-right:4px solid var(--ink);position:relative}
#crest h1{font-family:var(--black);font-size:68px;line-height:.86;color:var(--gold-l);letter-spacing:.01em}
#crest h1 span{display:block;color:var(--vellum)}
#crest .line{margin:14px 0 4px;font-size:18px;color:var(--vellum)}
#crest .now{margin:0;font-size:15px;color:var(--mist)}
#crest .how{margin:14px 0 0;font-size:14px;color:var(--mist)}
kbd{font-family:var(--pix);font-size:13px;padding:0 5px;background:var(--lapis-0);border:2px solid var(--gold-d);color:var(--gold-l)}
#chron{grid-column:1;grid-row:2;overflow:auto;background:var(--lapis-1);border-right:4px solid var(--ink);padding:6px 28px 28px}
#chron h2{font-family:var(--black);font-size:36px;color:var(--gold);margin:6px 0 2px}
#chron h3{font-family:var(--bastard);font-size:20px;color:var(--verd-l);margin:16px 0 4px}
#chron ul{list-style:none;margin:0;padding:0}
#chron li button{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:5px 6px;margin:0 -6px;color:var(--vellum)}
#chron li button::before{content:"";width:8px;height:8px;background:var(--gold-d);transform:translateY(-1px);box-shadow:0 0 0 2px var(--ink)}
#chron li button:hover,#chron li button[aria-current="true"]{background:var(--lapis-2)}
#chron li button:hover::before,#chron li button[aria-current="true"]::before{background:var(--verm)}
#chron li b{font-weight:500}
#chron li small{display:block;color:var(--mist);font-size:13px}
#chron .scribe{margin-top:22px;font-size:13px;color:var(--mist);border-top:2px solid var(--lapis-2);padding-top:10px}
#chron .scribe output{color:var(--gold-l)}
.boards{display:inline-block;margin-top:12px;font-size:13px}

/* the world */
#world{grid-column:2;grid-row:1/3;position:relative;overflow:hidden;background:#0b2a5a;touch-action:none;user-select:none;-webkit-user-select:none}
#map{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
#signs{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.sign{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;border:0;background:var(--lapis-1);color:var(--gold-l);
  font-family:var(--bastard);font-size:19px;line-height:1;padding:5px 10px 9px;box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--ink);
  clip-path:polygon(-6px -6px,calc(100% + 6px) -6px,calc(100% + 6px) 100%,50% calc(100% - 5px),-6px 100%)}
.sign:hover,.sign[aria-current="true"]{background:var(--verm-d);color:var(--vellum)}
.sign.small{font-family:var(--pix);font-size:12px;font-weight:500;padding:3px 6px 4px;background:var(--ink);color:var(--vellum);box-shadow:0 0 0 2px var(--gold-d);clip-path:none;white-space:normal;text-align:center;max-width:116px;line-height:1.15}
.sign.small:hover,.sign.small[aria-current="true"]{background:var(--lapis-2)}
.hud{position:absolute;z-index:3}
.raven-btn{display:flex;align-items:center;gap:10px;background:var(--verm);color:var(--vellum);border:0;padding:8px 14px 8px 10px;font-weight:600;font-size:16px;
  box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--ink)}
.raven-btn:hover{background:var(--verm-d)}
.raven-btn svg{width:30px;height:24px}
#ravenTop{top:18px;right:18px}
#hint{left:50%;bottom:18px;margin:0;transform:translateX(-50%);font-size:14px;background:var(--ink);color:var(--vellum);padding:4px 12px;box-shadow:0 0 0 2px var(--gold-d);pointer-events:none;transition:opacity .6s}
#hint.gone{opacity:0}

/* the dialog: a framed leaf with an illuminated capital */
.leaf{background:var(--lapis-1);border:4px solid var(--gold);outline:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 5px var(--gold-d),0 18px 40px -8px rgba(4,6,20,.7);position:relative}
.leaf::before,.leaf::after{content:"";position:absolute;width:14px;height:14px;background:var(--verm);border:3px solid var(--ink);top:-9px;left:-9px}
.leaf::after{left:auto;right:-9px}
#dlg{position:absolute;z-index:4;left:50%;bottom:22px;transform:translateX(-50%);width:min(700px,calc(100% - 40px));max-height:min(56%,520px);display:flex;flex-direction:column}
#dlg[hidden],#raven[hidden]{display:none}
#dlg header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 22px 8px}
#dlg h2{font-family:var(--black);font-size:42px;line-height:.95;color:var(--gold-l)}
#dlg .sub{margin:4px 0 0;color:var(--mist);font-size:15px}
#dlg .body{overflow:auto;padding:4px 22px 20px;outline:none}
.leave{flex:none;background:var(--ink);color:var(--gold-l);border:0;padding:6px 12px;font-size:14px;box-shadow:0 0 0 2px var(--gold-d)}
.leave:hover{background:var(--verm-d)}
.dc::first-letter{float:left;font-family:var(--black);font-size:62px;line-height:.78;padding:8px 9px 4px;margin:4px 12px 0 0;background:var(--verm);color:var(--gold-l);box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--ink)}
.dc{margin:6px 0 12px;max-width:62ch}
.tally{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.tally li{display:flex;gap:10px;align-items:baseline}
.tally b{font-family:var(--bastard);font-size:24px;font-weight:400;color:var(--gold);min-width:4.8em}
.laurels{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:10px}
.laurels li{padding-left:22px;position:relative}
.laurels li::before{content:"";position:absolute;left:2px;top:7px;width:8px;height:8px;background:var(--gold);box-shadow:0 0 0 2px var(--ink),3px 3px 0 2px var(--verm-d)}
.laurels b{font-weight:600;color:var(--gold-l)}
.laurels span{display:block;color:var(--mist);font-size:15px}
.pennants{display:flex;flex-wrap:wrap;gap:8px 10px;list-style:none;padding:0;margin:10px 0 0}
.pennants li{font-size:14px;background:var(--verd);color:var(--ink);font-weight:600;padding:3px 14px 3px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%)}
.pennants.lapis li{background:var(--lapis-3)}
.dlg-h{font-family:var(--bastard);font-size:22px;color:var(--verd-l);margin:14px 0 2px}
.facts{margin:10px 0 0;padding-left:20px;color:var(--mist)}

/* the raven: the plain view */
#raven{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,12,38,.82);padding:20px}
#raven .leaf{width:min(520px,100%);padding:26px 28px 24px}
#raven h2{font-family:var(--black);font-size:52px;line-height:.9;color:var(--gold-l)}
#raven p{margin:10px 0}
.mail{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.mail code{font-family:var(--pix);font-size:19px;color:var(--gold-l);user-select:all;-webkit-user-select:all;background:var(--ink);padding:4px 10px}
.mail button,.ravlinks a{background:var(--gold);color:var(--ink);border:0;padding:5px 12px;font-weight:600;font-size:15px;text-decoration:none;box-shadow:0 0 0 2px var(--ink)}
.mail button:hover,.ravlinks a:hover{background:var(--gold-l)}
.ravlinks{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 18px}
#copied{color:var(--verd-l);font-size:14px}

#bar{display:none}
@media (max-width:999px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  #crest{grid-row:1;padding:10px 16px 10px;border-right:0;border-bottom:4px solid var(--ink);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
  #crest h1{font-size:36px;line-height:1}
  #crest h1 span{display:inline;margin-left:.2em}
  #crest .line{margin:0;font-size:14px;flex-basis:100%}
  #crest .now,#crest .how{display:none}
  #world{grid-column:1;grid-row:2}
  #ravenTop{display:none}
  #hint{bottom:12px;font-size:13px;white-space:nowrap}
  #hint .k{display:none}
  #dlg h2{font-size:30px}
  #bar{grid-row:3;display:flex;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--lapis-1);border-top:4px solid var(--ink)}
  #bar button{flex:1;justify-content:center}
  .chron-btn{background:var(--lapis-2);color:var(--vellum);border:0;font-weight:600;box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--ink);padding:8px 12px}
  #chron{position:fixed;left:0;right:0;bottom:0;top:18%;z-index:8;border:0;border-top:4px solid var(--gold);box-shadow:0 -6px 0 var(--ink);padding:8px 20px 24px;display:none}
  #chron.open{display:block}
  #dlg{bottom:12px;width:calc(100% - 28px);max-height:62%}
  #dlg header{padding:14px 16px 6px}
  #dlg .body{padding:2px 16px 16px}
  .dc::first-letter{font-size:50px}
}
@media (min-width:1000px){#dlg{bottom:auto;top:86px;transform:none;width:min(560px,54%);max-height:calc(100% - 120px)}#dlg.r{left:auto;right:22px}#dlg.l{left:22px}}
#chronClose{display:none}
@media (max-width:999px){#chronClose{display:inline-block;float:right;margin-top:10px}}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<header id="crest">
  <h1 id="nm"></h1>
  <p class="line" id="ln"></p>
  <p class="now" id="nw"></p>
  <p class="how">Walk the gold roads with <kbd>arrows</kbd> or <kbd>WASD</kbd>, or tap where you want to go. Step through a door to read what happened there.</p>
</header>
<nav id="chron" aria-label="Chronicle of every place in the realm">
  <button class="leave" id="chronClose" type="button">Close</button>
  <h2>The Chronicle</h2>
  <div id="chronList"></div>
  <p class="scribe">Last road found by A*: <output id="astar">none yet</output></p>
  <a class="boards" href="index.html">← all boards</a>
</nav>
<main id="world">
  <canvas id="map" role="img" aria-label="A pixel-art kingdom seen from above. Castles, towers, a hall, a grimoire and a village of workshops, joined by gold roads. A small knight stands at the waystone."></canvas>
  <div id="signs"></div>
  <p class="hud" id="hint"><span class="k">Arrows or WASD to walk. </span>Tap anywhere to travel there.</p>
  <button class="hud raven-btn" id="ravenTop" type="button" aria-haspopup="dialog"><svg aria-hidden="true" class="ravico"></svg>Send a raven</button>
  <section id="dlg" class="leaf" role="dialog" aria-labelledby="dlgT" hidden>
    <header><div><h2 id="dlgT"></h2><p class="sub" id="dlgS"></p></div><button class="leave" id="dlgX" type="button">Leave <kbd>Esc</kbd></button></header>
    <div class="body" id="dlgB" tabindex="-1"></div>
  </section>
</main>
<div id="bar">
  <button class="chron-btn" id="chronBtn" type="button" aria-controls="chron" aria-expanded="false">Chronicle</button>
  <button class="raven-btn" id="ravenBar" type="button" aria-haspopup="dialog"><svg aria-hidden="true" class="ravico"></svg>Send a raven</button>
</div>
<div id="raven" role="dialog" aria-modal="true" aria-labelledby="ravT" hidden>
  <div class="leaf">
    <button class="leave" id="ravX" type="button" style="float:right">Close <kbd>Esc</kbd></button>
    <h2 id="ravT" tabindex="-1"></h2>
    <p id="ravL"></p>
    <p id="ravN" style="color:var(--mist);font-size:15px"></p>
    <div class="mail"><code id="ravE"></code><button id="copyBtn" type="button">Copy email</button><span id="copied" role="status"></span></div>
    <div class="ravlinks"><a id="ravG" target="_blank" rel="noopener">GitHub</a><a id="ravI" target="_blank" rel="noopener">LinkedIn</a><a id="ravR">Resume</a></div>
    <a class="boards" href="index.html">← all boards</a>
  </div>
</div>

<script src="data.js"></script>

/* ---------- view, camera, effects ---------- */
const cv = $("#map"), ctx = cv.getContext("2d"), wrap = $("#world"), signs = $("#signs");
let scale = 2, VW = 0, VH = 0, frame, img, view, cam = { x: 0, y: 0 }, camReady = false;
function layout() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  scale = w >= 1900 ? 3 : 2;
  VW = Math.ceil(w / scale); VH = Math.ceil(h / scale);
  cv.width = VW; cv.height = VH; cv.style.width = VW * scale + "px"; cv.style.height = VH * scale + "px";
  frame = PFX.createFrame(VW, VH); img = new ImageData(VW, VH); view = new Uint32Array(VW * VH);
  ctx.imageSmoothingEnabled = false;
  for (const s of signs.children) { const p = PLACES[s.dataset.k]; s.style.left = (p.x + p.w / 2) * TS * scale + "px"; s.style.top = (p.y * TS + (p.big ? -6 : 2)) * scale + "px"; }
  camReady = false;
}
const fx = [];
const torchOpts = { light: 0.55, palette: ["#4a1712", "#8f2216", "#d8432b", "#f2561d", "#ff8a2a", "#e8bb47", "#ffe26b", "#f8e3a2", "#ffffff"] };
// torches go on after layout; positions are world pixels
function initFx() {
  for (const [x, y] of TORCHES) fx.push({ wx: x, wy: y, f: PFX.createFx(PFX.torch, { ...torchOpts, seed: (x * 7 + y) % 50 }) });
  fx.push({ wx: 230, wy: 196, f: PFX.createFx(PFX.leaves, { seed: 8 }), layer: "front" });
  fx.push({ wx: 520, wy: 560, f: PFX.createFx(PFX.leaves, { seed: 3 }), layer: "front" });
  fx.forEach((e, i) => e.f.update(0.37 * i + 0.4));
}
let chestFx = null, chestOn = false;
function chestReset() { chestFx = PFX.createFx(PFX.chest, { seed: 3, light: 0.8 }); chestOn = false; }

function stepCamera(dt, snap) {
  const shut = $("#dlg").hidden, wide = innerWidth >= 1000;
  let tx = knight.x - VW * (shut || !wide ? 0.5 : dlgSide === "r" ? 0.27 : 0.73), ty = knight.y - VH * (shut ? 0.62 : wide ? 0.55 : 0.3);
  tx = WW <= VW ? (WW - VW) / 2 : Math.max(0, Math.min(WW - VW, tx));
  ty = WH <= VH ? (WH - VH) / 2 : Math.max(0, Math.min(WH - VH, ty));
  const k = snap || reduce.matches ? 1 : 1 - Math.exp(-dt * 5);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}

function fillView(cx, cy) {
  for (let y = 0; y < VH; y++) {
    const wy = y + cy, row = y * VW;
    if (wy < 0 || wy >= WH) { view.fill(SEA, row, row + VW); continue; }
    const a = Math.max(0, -cx), b = Math.min(VW, WW - cx);
    if (a > 0) view.fill(SEA, row, row + a);
    if (b < VW) view.fill(SEA, row + Math.max(b, 0), row + VW);
    if (b > a) view.set(worldPx.subarray(wy * WW + cx + a, wy * WW + cx + b), row + a);
  }
}

let hover = null, T = 0;
function render(dt) {
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  fillView(cx, cy);
  PFX.clearFrame(frame);
  const fdt = reduce.matches ? 0 : dt;
  for (const e of fx) { e.f.update(fdt); e.f.options.x = e.wx - cx; e.f.options.y = e.wy - cy; e.f.draw(frame, e.layer); }
  if (CHEST) {
    if (chestOn) { chestFx.update(fdt); if (chestFx.done()) chestReset(); }
    chestFx.options.x = CHEST[0] - cx; chestFx.options.y = CHEST[1] - cy; chestFx.draw(frame);
  }
  PFX.composite(frame, img.data, view);
  ctx.putImageData(img, 0, 0);

  // water glints
  for (let i = 0; i < WATERS.length; i += 3) {
    const [x, y] = WATERS[i], ph = (T * 0.9 + hash(x, y, 1) * 7) % 7;
    if (ph < 1.2) { ctx.fillStyle = ph < 0.6 ? C.lapisH : C.lapisL; ctx.fillRect(x - cx + 3 + ((x >> 2) % 8), y - cy + 6 + ((y >> 3) % 5), ph < 0.6 ? 3 : 2, 1); }
  }
  // pennants
  const wave = Math.floor(T * 3) % 2;
  for (const [x, y, c] of FLAGS) {
    const X = x - cx, Y = y - cy;
    ctx.fillStyle = C.ink; ctx.fillRect(X - 1, Y - 2, 1, 10);
    ctx.fillStyle = c; ctx.fillRect(X, Y - 2, 7, 4); ctx.fillRect(X + 7, Y - 2 + wave, 3, 3 - wave);
    ctx.fillStyle = c === C.gold ? C.goldD : C.goldL; ctx.fillRect(X, Y + 1, 7, 1);
  }
  // ravens circling the rookery
  const rk = PLACES.find((p) => p.id === "raven"), rx = (rk.door[0] * TS + 8) - cx, ry = (rk.y * TS + 6) - cy;
  for (let i = 0; i < 3; i++) {
    const a = T * (0.7 + i * 0.13) + i * 2.1, x = Math.round(rx + Math.cos(a) * (14 + i * 5)), y = Math.round(ry + Math.sin(a) * (6 + i * 2) - i * 4), up = Math.floor(T * 6 + i) % 2;
    ctx.fillStyle = C.ink; ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x - 3, y - up, 2, 1); ctx.fillRect(x + 2, y - up, 2, 1);
  }
  // the road ahead
  ctx.fillStyle = C.goldL;
  knight.path.forEach(([x, y], i) => { if (i % 2 === 0) ctx.fillRect(x - cx - 1, y - cy - 2, 2, 2); });
  if (knight.path.length) {
    const [x, y] = knight.path[knight.path.length - 1], b = Math.floor(T * 4) % 2;
    ctx.fillStyle = C.ink; ctx.fillRect(x - cx, y - cy - 14 - b, 1, 13);
    ctx.fillStyle = C.verm; ctx.fillRect(x - cx + 1, y - cy - 14 - b, 6, 4);
  }
  // hover reticle
  if (hover) {
    const [hx, hy] = hover, X = hx * TS - cx, Y = hy * TS - cy, ok = walkable(at(hx, hy)) || PLACES.some((p) => hx >= p.x && hx < p.x + p.w && hy >= p.y && hy < p.y + p.h);
    ctx.fillStyle = ok ? C.goldL : C.verm;
    for (const [a, b] of [[0, 0], [12, 0], [0, 15], [12, 15]]) ctx.fillRect(X + a, Y + b, 4, 1);
    for (const [a, b] of [[0, 0], [15, 0], [0, 12], [15, 12]]) ctx.fillRect(X + a, Y + b, 1, 4);
  }
  // the knight and his shadow
  const kx = Math.round(knight.x) - cx, ky = Math.round(knight.y) - cy;
  ctx.fillStyle = "rgba(8,14,10,.45)"; ctx.fillRect(kx - 5, ky - 1, 10, 2); ctx.fillRect(kx - 4, ky + 1, 8, 1);
  const moving = knight.moving, leg = moving ? 1 + (Math.floor(knight.walk * 8) % 2) : 0;
  const key = (knight.face === "left" ? "left" : knight.face === "right" ? "side" : knight.face) + leg;
  ctx.drawImage(KS[key], kx - 6, ky - 13 - (moving && leg === 1 ? 1 : 0));
  signs.style.transform = `translate(${-cx * scale}px,${-cy * scale}px)`;
  cv.style.transform = "";
}

/* ---------- input ---------- */
const keys = new Set();
const DIRK = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
addEventListener("keydown", (e) => {
  if (!$("#raven").hidden) { if (e.key === "Escape") closeRaven(); return; }
  if (e.key === "Escape") { if (!$("#dlg").hidden) closeDlg(true); else closeChron(); return; }
  const tag = (e.target.tagName || "").toLowerCase();
  if (DIRK[e.code] && !e.metaKey && !e.ctrlKey && !e.altKey && tag !== "input") {
    if (!$("#chron").classList.contains("open") || !matchMedia("(max-width:999px)").matches) {
      e.preventDefault(); keys.add(e.code); knight.path = []; knight.goal = null;
      if (!$("#dlg").hidden && dlgPlace) closeDlg(false);
      hideHint();
    }
  }
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());

function worldTile(ev) {
  const r = cv.getBoundingClientRect();
  return [Math.floor(((ev.clientX - r.left) / scale + Math.round(cam.x)) / TS), Math.floor(((ev.clientY - r.top) / scale + Math.round(cam.y)) / TS)];
}
cv.addEventListener("pointermove", (e) => { hover = worldTile(e); });
cv.addEventListener("pointerleave", () => { hover = null; });
cv.addEventListener("pointerdown", (e) => {
  const [tx, ty] = worldTile(e); hideHint();
  if (!$("#dlg").hidden) closeDlg(false);
  const p = PLACES.find((q) => tx >= q.x && tx < q.x + q.w && ty >= q.y && ty < q.y + q.h);
  if (p) return travel(p.door[0], p.door[1], p);
  const t = nearestWalkable(tx, ty);
  if (t) travel(t[0], t[1], doorAt.get(t[1] * MW + t[0]));
});

let lastTile = -1;
function stepKnight(dt) {
  let dx = 0, dy = 0;
  for (const k of keys) { dx += DIRK[k][0]; dy += DIRK[k][1]; }
  const sp = 84 * dt;
  knight.moving = false;
  if (dx || dy) {
    const n = Math.hypot(dx, dy); dx /= n; dy /= n;
    if (feetFree(knight.x + dx * sp, knight.y)) knight.x += dx * sp;
    if (feetFree(knight.x, knight.y + dy * sp)) knight.y += dy * sp;
    knight.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up";
    knight.moving = true;
  } else if (knight.path.length) {
    const [px, py] = knight.path[0], ex = px - knight.x, ey = py - knight.y, d = Math.hypot(ex, ey);
    if (d <= sp * 1.3) { knight.x = px; knight.y = py; knight.path.shift(); if (!knight.path.length) arrive(); }
    else { knight.x += (ex / d) * sp * 1.3; knight.y += (ey / d) * sp * 1.3; knight.face = Math.abs(ex) > Math.abs(ey) ? (ex > 0 ? "right" : "left") : ey > 0 ? "down" : "up"; }
    knight.moving = knight.path.length > 0;
  }
  if (knight.moving) knight.walk += dt;
  const [tx, ty] = tileOf(knight.x, knight.y), ti = ty * MW + tx;
  if (ti !== lastTile) { lastTile = ti; if ((dx || dy) && doorAt.has(ti)) open(doorAt.get(ti), false); }
}

/* ---------- the places' words ---------- */
const el = (tag, props = {}, kids = []) => { const n = document.createElement(tag); Object.assign(n, props); for (const k of [].concat(kids)) n.append(k); return n; };
function content(p) {
  const body = [];
  if (p.kind === "exp") {
    const x = D.experience[p.i];
    body.push(el("p", { className: "dc", textContent: x.did }));
    body.push(el("ul", { className: "tally" }, x.numbers.map(([n, l]) => el("li", {}, [el("b", { textContent: n }), el("span", { textContent: l })]))));
    return { title: p.name, sub: `${x.org}. ${x.role}. ${x.when}.`, body };
  }
  if (p.kind === "wins") {
    body.push(el("p", { className: "dc", textContent: "Six laurels hang in this hall, won in olympiads, modeling finals, national contests and two ventures." }));
    body.push(el("ul", { className: "laurels" }, D.wins.map((w) => el("li", {}, [el("b", { textContent: w.what }), el("span", { textContent: w.detail })]))));
    return { title: p.name, sub: "Wins and honours", body };
  }
  if (p.kind === "proj") {
    const x = D.projects[p.i];
    body.push(el("p", { className: "dc", textContent: x.one }));
    body.push(el("ul", { className: "pennants" }, x.stack.map((s) => el("li", { textContent: s }))));
    return { title: x.name, sub: `A workshop on Artisans' Row. Kind: ${x.kind}.`, body };
  }
  if (p.kind === "skills") {
    body.push(el("p", { className: "dc", textContent: "Every spell in this book has been cast on real work: contests, research, startups and the apps on Artisans' Row." }));
    body.push(el("h3", { className: "dlg-h", textContent: "Tongues" }));
    body.push(el("ul", { className: "pennants lapis" }, D.skills.languages.map((s) => el("li", { textContent: s }))));
    body.push(el("h3", { className: "dlg-h", textContent: "Arts" }));
    body.push(el("ul", { className: "pennants" }, D.skills.areas.map((s) => el("li", { textContent: s }))));
    return { title: p.name, sub: "Languages and areas", body };
  }
  if (p.kind === "about") {
    body.push(el("p", { className: "dc", textContent: `${D.name}. ${D.now}. ${D.line}` }));
    body.push(el("p", { textContent: `From ${D.place}.`, style: "color:var(--mist);margin:0" }));
    body.push(el("ul", { className: "facts" }, D.facts.map((f) => el("li", { textContent: f }))));
    return { title: p.name, sub: "Here begins the realm", body };
  }
  return null;
}

let dlgPlace = null, lastFocus = null, dlgSide = "r";
function open(p, fromList) {
  if (p.kind === "raven") return openRaven();
  if (dlgPlace === p && !$("#dlg").hidden) return;
  const c = content(p);
  dlgPlace = p; dlgSide = knight.x < WW / 2 ? "r" : "l"; $("#dlg").className = "leaf " + dlgSide;
  $("#dlgT").textContent = c.title; $("#dlgS").textContent = c.sub;
  $("#dlgB").replaceChildren(...c.body); $("#dlgB").scrollTop = 0;
  $("#dlg").hidden = false;
  document.querySelectorAll("[data-id]").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === p.id)));
  if (p.kind === "wins" && chestFx && !chestOn) { chestReset(); chestOn = !reduce.matches; }
  if (fromList) { lastFocus = document.activeElement; $("#dlgB").focus({ preventScroll: true }); }
}
function closeDlg(restore) {
  $("#dlg").hidden = true; dlgPlace = null;
  document.querySelectorAll("[data-id]").forEach((b) => b.setAttribute("aria-current", "false"));
  if (restore && lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}
$("#dlgX").addEventListener("click", () => closeDlg(true));

/* chronicle entries jump straight there; map signs walk */
function goTo(p, walk) {
  closeChron();
  if (walk && !reduce.matches) { travel(p.door[0], p.door[1], p); return; }
  knight.path = []; knight.goal = null;
  knight.x = p.door[0] * TS + 8; knight.y = p.door[1] * TS + 11; knight.face = "up";
  lastTile = p.door[1] * MW + p.door[0];
  open(p, true);
}
function buildLists() {
  $("#nm").innerHTML = ""; $("#nm").append(D.name.split(" ")[0], el("span", { textContent: D.name.split(" ").slice(1).join(" ") }));
  $("#ln").textContent = D.line; $("#nw").textContent = D.now;
  const groups = [
    ["Keeps and towers", PLACES.filter((p) => p.kind === "exp"), (p) => `${D.experience[p.i].org}, ${D.experience[p.i].when}`],
    ["Halls", PLACES.filter((p) => ["about", "wins", "skills"].includes(p.kind)), (p) => ({ about: "Who walks here", wins: "Six wins and honours", skills: "Languages and areas" })[p.kind]],
    ["Artisans' Row", PLACES.filter((p) => p.kind === "proj"), (p) => D.projects[p.i].one.split(/[.:]/)[0]],
    ["The Rookery", PLACES.filter((p) => p.kind === "raven"), () => "Email, GitHub, LinkedIn, resume"],
  ];
  const list = $("#chronList");
  for (const [h, ps, sub] of groups) {
    list.append(el("h3", { textContent: h }), el("ul", {}, ps.map((p) => {
      const b = el("button", { type: "button" }, [el("span", {}, [el("b", { textContent: p.kind === "exp" ? `${p.name}` : p.name }), el("small", { textContent: sub(p) })])]);
      b.dataset.id = p.id; b.addEventListener("click", () => goTo(p, false));
      return el("li", {}, b);
    })));
  }
  PLACES.forEach((p, k) => {
    if (p.kind === "about") return;
    const s = el("button", { type: "button", className: "sign" + (p.big ? "" : " small"), textContent: p.name });
    s.dataset.k = k; s.dataset.id = p.id; s.tabIndex = -1;
    s.setAttribute("aria-hidden", "true");
    s.addEventListener("pointerdown", (e) => e.stopPropagation());
    s.addEventListener("click", () => { hideHint(); goTo(p, true); });
    signs.append(s);
  });
}

/* ---------- the raven ---------- */
function openRaven() {
  closeChron();
  lastFocus = document.activeElement;
  $("#raven").hidden = false; $("#ravT").focus();
}
function closeRaven() { $("#raven").hidden = true; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
$("#ravenTop").addEventListener("click", openRaven); $("#ravenBar").addEventListener("click", openRaven);
$("#ravX").addEventListener("click", closeRaven);
$("#raven").addEventListener("click", (e) => { if (e.target.id === "raven") closeRaven(); });
$("#raven").addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const f = [...$("#raven").querySelectorAll("button,a[href]")], first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
$("#ravT").textContent = D.name; $("#ravL").textContent = D.line; $("#ravN").textContent = D.now;
$("#ravE").textContent = D.links.email; $("#ravG").href = D.links.github; $("#ravI").href = D.links.linkedin; $("#ravR").href = D.links.resume;
$("#copyBtn").addEventListener("click", async () => {
  const s = $("#copied");
  try { await navigator.clipboard.writeText(D.links.email); s.textContent = "Copied."; }
  catch {
    const r = document.createRange(); r.selectNodeContents($("#ravE")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    s.textContent = document.execCommand("copy") ? "Copied." : "Selected. Press Ctrl or Cmd + C.";
  }
});
// a raven drawn in pixels
const RAV = ["......oo....", ".....oooog..", "....ooooo...", ".ooooooo....", "oooooooo....", "..oooooo....", "...o..o....."];
document.querySelectorAll(".ravico").forEach((s) => {
  s.setAttribute("viewBox", "0 0 12 8"); s.setAttribute("shape-rendering", "crispEdges");
  s.innerHTML = RAV.map((r, y) => [...r].map((c, x) => (c === "." ? "" : `<rect x="${x}" y="${y}" width="1" height="1" fill="${c === "g" ? C.gold : C.ink}"/>`)).join("")).join("");
});

/* ---------- chronicle sheet on phones ---------- */
function closeChron() { $("#chron").classList.remove("open"); $("#chronBtn").setAttribute("aria-expanded", "false"); }
$("#chronBtn").addEventListener("click", () => { const o = $("#chron").classList.toggle("open"); $("#chronBtn").setAttribute("aria-expanded", String(o)); if (o) $("#chronList button").focus(); });
$("#chronClose").addEventListener("click", () => { closeChron(); $("#chronBtn").focus(); });

let hinted = false;
function hideHint() { if (!hinted) { hinted = true; $("#hint").classList.add("gone"); } }

/* ---------- run ---------- */
buildLists();
layout(); initFx(); chestReset();
addEventListener("resize", layout);
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += reduce.matches ? 0 : dt;
  stepKnight(dt);
  stepCamera(dt, !camReady); camReady = true;
  render(dt);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
